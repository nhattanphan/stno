name: Rescan sDrive
on:
  workflow_dispatch:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
concurrency: rescan
jobs:
  scan:
    if: github.event_name != 'issues' || (startsWith(github.event.issue.title, 'Rescan sDrive') && github.event.issue.user.login == github.repository_owner)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -q requests cryptography
      - name: Scan 01_Samples and 02_Projects
        env:
          SDRIVE_SHARE_URL: ${{ secrets.SDRIVE_SHARE_URL }}
          SDRIVE_SHARE_PASSWORD: ${{ secrets.SDRIVE_SHARE_PASSWORD }}
          HUB_PASSWORD: ${{ secrets.HUB_PASSWORD }}
        run: python .github/scripts/rescan.py
      - name: Commit the new index
        run: |
          git config user.name "hub-rescan"
          git config user.email "hub-rescan@users.noreply.github.com"
          git add scan.enc.json
          git diff --cached --quiet || (git commit -m "Rescan sDrive file index" && git push)
      - name: Close the request
        if: github.event_name == 'issues' && always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Rescan finished (${{ job.status }}). Reload the hub in a minute."
