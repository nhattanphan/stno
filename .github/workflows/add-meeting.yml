name: Add meeting from issue
on:
  issues:
    types: [opened]
permissions:
  contents: write
  issues: write
jobs:
  add:
    if: github.event.issue.user.login == github.repository_owner && startsWith(github.event.issue.title, 'Add meeting')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update data.json
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: python3 .github/scripts/add_meeting.py
      - name: Commit
        run: |
          git config user.name "${{ github.repository_owner }}"
          git config user.email "${{ github.repository_owner }}@users.noreply.github.com"
          git add data.enc.json
          git commit -m "Add meeting (#${{ github.event.issue.number }})" || exit 0
          git push
      - name: Close issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh issue close ${{ github.event.issue.number }} --repo ${{ github.repository }} --comment "Added to the Meetings tab. The site updates in about a minute."
